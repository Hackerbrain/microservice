custom:
    message: Hello-world-new-changed-avcf

management:
  endpoints:
    web:
      exposure:
        include: refresh, health

eureka:
    instance:
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${server.port}
    client:
        service-url: 
            defaultZone: http://localhost:8671/eureka