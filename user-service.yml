custom:
    message: Hello-world-new-changed-avcf

management:
  endpoints:
    web:
      exposure:
        include: refresh, health

eureka:
    instance:
        prefer-ip-address: true
    client:
        fetch-registry: true
        register-with-eureka: true
        service-url: 
            defaultZone: http://localhost:8671/eureka